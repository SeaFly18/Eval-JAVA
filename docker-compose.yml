version: '3.8'
services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql_petitcrud
    environment:
      MYSQL_DATABASE: petitcrud_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p password"]
      interval: 5s
      timeout: 5s
      retries: 5

  