spring.application.name=PetitCRUDFilms

# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/petitcrud_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Pour que le fichier data.sql s'exécute après la création des tables par Hibernate
spring.sql.init.mode=always
